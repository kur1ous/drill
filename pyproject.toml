[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drill"
dynamic = ["version"]
description = "Spaced repetition for markdown notes, in the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kurious" }]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = []

[project.urls]
Repository = "https://github.com/kur1ous/drill"
Issues = "https://github.com/kur1ous/drill/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
drill = "drill.cli:main"

[tool.setuptools.dynamic]
version = { attr = "drill.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
